version: '3.8'

x-app-template: &app-template
  image: justsaiyn/devops-app:latest
  restart: unless-stopped
  environment:
    - PORT=8080
  networks:
    - isolated_network
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 5s

services:
  app-1:
    <<: *app-template
    container_name: devops-app-1

  app-2:
    <<: *app-template
    container_name: devops-app-2

  nginx:
    image: nginx:1.25-alpine
    container_name: devops-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    networks:
      - isolated_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: devops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - isolated_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: devops-grafana
    ports:
      - "3000:3000"
    networks:
      - isolated_network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - isolated_network

networks:
  isolated_network:
    driver: bridge
