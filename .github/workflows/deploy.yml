name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Tests
        run: go test -v ./...

  build-and-deploy:
    name: Build, Push & Deploy
    needs: test # Пайплайн пойдет дальше только после успешных тестов!
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build -t justsaiyn/devops-app:latest .
          docker push justsaiyn/devops-app:latest

      - name: Deploy to Production via Docker Compose
        run: |
          sudo docker compose pull
          sudo docker compose up -d --remove-orphans
